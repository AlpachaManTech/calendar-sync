<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendar Sync</title>
<style>
  :root { --bg: #0f1420; --card: #161d2c; --ink: #e6e9f0; --muted: #9aa3b5; --accent: #e0a84f; --line: #263047; }
  @media (prefers-color-scheme: light) { :root { --bg: #f5f2ea; --card: #fff; --ink: #1a2030; --muted: #5b6475; --accent: #a8701c; --line: #e4ddcc; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; }
  a { color: var(--accent); }
  footer { margin-top: 32px; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Calendar Sync</h1>
  <div class="card">
    <p>A personal calendar tool used by one person on their own computer. It is not a public
    service and has no other users.</p>
  </div>
  <footer><a href="privacy.html">Privacy policy</a></footer>
</main>
</body>
</html>
